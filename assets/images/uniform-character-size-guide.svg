<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="100%" height="auto" style="max-width:380px; font-family:'Urbanist', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="charBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="poloGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="shortsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="orangeBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6702"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="368" height="478" rx="20" fill="url(#charBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Card Header -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="340" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="16" cy="17" r="8" fill="#FF6702"/>
    <path d="M13 17 L15.5 19.5 L20 14.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="22" font-size="12" font-weight="800" fill="#0F172A" letter-spacing="0.4">HOW TO MEASURE YOUR CHILD</text>
  </g>

  <!-- ==================== STUDENT CHARACTER ILLUSTRATION ==================== -->
  <g transform="translate(145, 68)">
    <!-- Shadow beneath feet -->
    <ellipse cx="45" cy="336" rx="42" ry="7" fill="#CBD5E1" opacity="0.6"/>

    <!-- Shoes -->
    <path d="M22 325 C22 320 28 320 34 324 L36 332 C36 335 20 336 20 332 Z" fill="#1E293B"/>
    <path d="M54 324 C60 320 66 320 66 325 L68 332 C68 336 52 335 52 332 Z" fill="#1E293B"/>
    <!-- Socks -->
    <rect x="23" y="308" width="12" height="17" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="53" y="308" width="12" height="17" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Legs -->
    <rect x="24" y="245" width="10" height="66" rx="5" fill="#FED7AA"/>
    <rect x="54" y="245" width="10" height="66" rx="5" fill="#FED7AA"/>

    <!-- School Shorts -->
    <path d="M16 172 L72 172 L78 248 L51 248 L44 195 L37 248 L10 248 Z" fill="url(#shortsGrad)"/>
    <!-- Belt line -->
    <rect x="16" y="170" width="56" height="6" rx="2" fill="#0F172A"/>
    <rect x="40" y="169" width="8" height="8" rx="1.5" fill="#F59E0B"/>

    <!-- Arms -->
    <!-- Left Arm -->
    <path d="M12 78 L-4 150 C-6 156 -1 162 5 160 L14 156 L22 96 Z" fill="#FED7AA"/>
    <path d="M12 74 L4 116 L22 116 L22 80 Z" fill="#CBD5E1"/>
    <!-- Right Arm -->
    <path d="M76 78 L92 150 C94 156 89 162 83 160 L74 156 L66 96 Z" fill="#FED7AA"/>
    <path d="M76 74 L84 116 L66 116 L66 80 Z" fill="#CBD5E1"/>

    <!-- Hands -->
    <circle cx="2" cy="162" r="7" fill="#FED7AA"/>
    <circle cx="86" cy="162" r="7" fill="#FED7AA"/>

    <!-- Polo Shirt Body -->
    <path d="M15 72 L73 72 L76 174 L12 174 Z" fill="url(#poloGrad)"/>
    <!-- Polo Placket & Buttons -->
    <rect x="41" y="68" width="6" height="42" fill="#FFFFFF" rx="2"/>
    <circle cx="44" cy="78" r="1.8" fill="#FF6702"/>
    <circle cx="44" cy="88" r="1.8" fill="#FF6702"/>
    <circle cx="44" cy="98" r="1.8" fill="#FF6702"/>
    <!-- School Chest Badge -->
    <polygon points="26,88 32,84 38,88 38,96 32,100 26,96" fill="#FF6702"/>
    <polygon points="28,89 32,86 36,89 36,95 32,98 28,95" fill="#FFFFFF"/>

    <!-- Neck & Head -->
    <rect x="39" y="48" width="10" height="18" rx="3" fill="#FED7AA"/>
    <!-- Polo Collar -->
    <path d="M22 68 L44 76 L34 58 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M66 68 L44 76 L54 58 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M30 68 L44 75 L58 68" fill="none" stroke="#FF6702" stroke-width="2"/>

    <!-- Face -->
    <ellipse cx="44" cy="36" rx="19" ry="22" fill="#FED7AA"/>
    <!-- Ears -->
    <circle cx="24" cy="36" r="4.5" fill="#FED7AA"/>
    <circle cx="64" cy="36" r="4.5" fill="#FED7AA"/>
    <!-- Hair -->
    <path d="M24 32 C23 16 35 12 44 12 C54 12 65 16 64 32 C61 24 55 22 44 22 C33 22 27 25 24 32 Z" fill="#334155"/>
    <!-- Eyes & Smile -->
    <circle cx="37" cy="34" r="2" fill="#1E293B"/>
    <circle cx="51" cy="34" r="2" fill="#1E293B"/>
    <path d="M39 44 Q44 49 49 44" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="33" cy="40" r="3" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="55" cy="40" r="3" fill="#FCA5A5" opacity="0.6"/>
  </g>

  <!-- ==================== MEASUREMENT CALLOUTS ==================== -->

  <!-- 1. CHEST MEASUREMENT CALLOUT (Right) -->
  <g transform="translate(190, 168)">
    <!-- Dashed measurement line across chest -->
    <line x1="-36" y1="0" x2="30" y2="0" stroke="#FF6702" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="-36" cy="0" r="3.5" fill="#FF6702"/>
    <circle cx="30" cy="0" r="3.5" fill="#FF6702"/>

    <!-- Pointer to badge -->
    <path d="M30 0 L54 0" stroke="#FF6702" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Badge -->
    <g transform="translate(56, -18)">
      <rect x="0" y="0" width="118" height="36" rx="8" fill="#FFFFFF" stroke="#FF6702" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="10" y="15" font-size="10" font-weight="800" fill="#EA580C">CHEST (Fullest Part)</text>
      <text x="10" y="29" font-size="12" font-weight="900" fill="#0F172A">20" – 46" in</text>
    </g>
  </g>

  <!-- 2. WAIST MEASUREMENT CALLOUT (Right) -->
  <g transform="translate(190, 238)">
    <!-- Dashed measurement line across waist -->
    <line x1="-32" y1="0" x2="26" y2="0" stroke="#0284C7" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="-32" cy="0" r="3.5" fill="#0284C7"/>
    <circle cx="26" cy="0" r="3.5" fill="#0284C7"/>

    <!-- Pointer to badge -->
    <path d="M26 0 L54 0" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Badge -->
    <g transform="translate(56, -18)">
      <rect x="0" y="0" width="118" height="36" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="10" y="15" font-size="10" font-weight="800" fill="#0284C7">WAIST (Natural Line)</text>
      <text x="10" y="29" font-size="12" font-weight="900" fill="#0F172A">18" – 36" in</text>
    </g>
  </g>

  <!-- 3. GARMENT LENGTH CALLOUT (Left) -->
  <g transform="translate(142, 138)">
    <!-- Vertical length dimension bar -->
    <line x1="-12" y1="0" x2="-12" y2="104" stroke="#16A34A" stroke-width="2"/>
    <line x1="-18" y1="0" x2="-6" y2="0" stroke="#16A34A" stroke-width="2"/>
    <line x1="-18" y1="104" x2="-6" y2="104" stroke="#16A34A" stroke-width="2"/>
    
    <!-- Pointer to badge -->
    <path d="M-12 52 L-30 52" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Badge -->
    <g transform="translate(-124, 34)">
      <rect x="0" y="0" width="92" height="36" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="8" y="15" font-size="10" font-weight="800" fill="#16A34A">LENGTH</text>
      <text x="8" y="29" font-size="12" font-weight="900" fill="#0F172A">15" – 30" in</text>
    </g>
  </g>

  <!-- 4. TOTAL HEIGHT CALLOUT (Far Left Ruler) -->
  <g transform="translate(26, 75)">
    <!-- Ruler bar -->
    <line x1="0" y1="5" x2="0" y2="330" stroke="#64748B" stroke-width="2"/>
    <line x1="-6" y1="5" x2="6" y2="5" stroke="#64748B" stroke-width="2"/>
    <line x1="-6" y1="330" x2="6" y2="330" stroke="#64748B" stroke-width="2"/>
    <!-- Tick marks -->
    <line x1="0" y1="85" x2="4" y2="85" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="0" y1="165" x2="4" y2="165" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="0" y1="245" x2="4" y2="245" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Badge -->
    <g transform="translate(10, 140)">
      <rect x="0" y="0" width="95" height="42" rx="8" fill="#0F172A" filter="url(#cardShadow)"/>
      <text x="8" y="16" font-size="9" font-weight="800" fill="#F8FAFC" letter-spacing="0.3">TOTAL HEIGHT</text>
      <text x="8" y="32" font-size="12" font-weight="900" fill="#38BDF8">95 – 185 cm</text>
    </g>
  </g>

  <!-- Quick Parent Tip Box at Bottom -->
  <g transform="translate(20, 424)">
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="14" y="20" font-size="11" font-weight="800" fill="#92400E">💡 Parent Tip for Fast Growing Students:</text>
    <text x="14" y="36" font-size="10.5" font-weight="600" fill="#78350F">Measure over undergarments &amp; choose +1 size for comfort.</text>
  </g>
</svg>